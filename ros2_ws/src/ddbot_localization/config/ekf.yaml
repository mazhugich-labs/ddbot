ekf_filter_node_odom:
  ros__parameters:
    frequency: 25.0

    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /ddbot/wheel/odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_nodelay: false
    odom0_queue_size: 15

    imu0: /ddbot/imu
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_nodelay: false
    imu0_queue_size: 15
    imu0_remove_gravitational_acceleration: true

    use_control: true
    control_timeout: 0.0
    control_config: [true, false, false, false, false, true]
    acceleration_limits: [0.3, 0.0, 0.0, 0.0, 0.0, 1.25]
    deceleration_limits: [0.3, 0.0, 0.0, 0.0, 0.0, 1.25]
    acceleration_gains: [0.8, 0.0, 0.0, 0.0, 0.0, 0.5]
    deceleration_gains: [0.9, 0.0, 0.0, 0.0, 0.0, 0.9]

ekf_filter_node_map:
  ros__parameters:
    frequency: 25.0

    two_d_mode: true

    publish_acceleration: false

    publish_tf: True

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    odom0: /ddbot/wheel/odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_nodelay: false
    odom0_queue_size: 15

    imu0: /ddbot/imu
    imu0_config: [
